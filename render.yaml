databases:
  - name: medcare-db
    databaseName: medcare
    user: medcare
    plan: free

services:
  - type: web
    name: medcare-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/hospitals
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.19.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medcare-db
          property: connectionString
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
